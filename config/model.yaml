# Własny serwer Ollama z polskim modelem Bielik. Natywne API /api/chat, bo tylko ono pozwala ustawić num_ctx
# (API /v1 zgodne z OpenAI ucina prompt do 4096 tokenów). Bez klucza: api_key_env pusty.
# Dla Mistral La Plateforme: endpoint https://api.mistral.ai/v1/chat/completions, name ministral-3b-latest,
# api_key_env MISTRAL_API_KEY.
name: SpeakLeash/bielik-minitron-7B-v3.0-instruct:Q4_K_M
endpoint: http://34.12.224.222:11434/api/chat
api_key_env: ""
# 12288: najdłuższy prompt (tekst przycięty do 14 000 znaków + wzór) to ~7800 tokenów + odpowiedź, a model wciąż
# mieści się w całości w GPU hosta (6,6 GB). Przy 16384 część szła na CPU i generowanie było ~25% wolniejsze.
num_ctx: 12288
timeout_s: 300
temperature: 0
json_mode: true
# llm: klasa i JSON z modelu (reguły tylko, gdy serwer nie odpowie). rules: same reguły.
extraction: llm
# Pliki przetwarzane naraz w CLI. Ollama z OLLAMA_NUM_PARALLEL=1 i tak obsługuje AI po kolei – 2 nakładają tylko OCR
# na czekanie; API z równoległością (np. Mistral) skorzysta z większej liczby.
workers: 2
