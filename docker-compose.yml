services:
  odwolania2json:
    build: .
    # Nazwany obraz: `docker compose run` bierze go gotowego (zbudowanego przy wdrożeniu), bez pobierania w czasie oceny.
    image: odwolania2json:latest
    env_file:
      - path: .env
        required: false # klucze API są opcjonalne; brak pliku nie może zatrzymać przetwarzania
    ports:
      - "8000:8000" # tylko dla formularza: docker compose run --service-ports odwolania2json python -m app --serve
    volumes:
      # input/ i output/ leżą w katalogu projektu (na serwerze testowym już istnieją); aplikacja czyta je jako ROOT/input|output.
      - ./input:/app/input
      - ./output:/app/output
      - ./trace:/app/trace
